<!doctype html>
<meta charset="utf-8">
<style>
  :root { --paper: #F6F3E7; --sage: #DDE8D0; --leaf: #2C6145; --ink: #1F3D2E; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(70% 55% at 22% 12%, #FFFDF4 0%, rgba(255,253,244,0) 70%),
      radial-gradient(80% 60% at 85% 95%, #CFE0C0 0%, rgba(207,224,192,0) 70%),
      linear-gradient(160deg, #F4F1E2 0%, #E6EEDA 55%, #D7E5CB 100%);
    display: grid; place-items: center;
  }
  svg.leaves { position: absolute; inset: 0; width: 100%; height: 100%; }
  .phone {
    position: relative; width: 508px; height: 1100px; padding: 13px; border-radius: 74px;
    background: linear-gradient(145deg, #2A3A31 0%, #17231C 60%, #101A14 100%);
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,.35) inset,
      0 2px 0 1px rgba(16,26,20,.9),
      0 60px 90px -30px rgba(31,61,46,.45),
      0 30px 40px -20px rgba(31,61,46,.30),
      0 0 0 1px rgba(31,61,46,.25);
  }
  .screen { position: relative; width: 508px; height: 1100px; border-radius: 62px; overflow: hidden; background: var(--paper); }
  .screen img { display: block; width: 100%; height: 100%; }
  .island { position: absolute; top: 15px; left: 50%; width: 118px; height: 32px; margin-left: -59px; border-radius: 16px; background: #0D1410; }
  .touch { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
           background: rgba(31,61,46,.16); border: 2.5px solid rgba(31,61,46,.38); box-shadow: 0 0 0 10px rgba(31,61,46,.05); }
</style>
<svg class="leaves" viewBox="0 0 1080 1350" fill="none" stroke="#9DB98F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
  <!-- left sprig -->
  <g transform="translate(40 1120) rotate(-14)">
    <path d="M0 200 C 40 120, 70 40, 150 -60"/>
    <path d="M28 150 c -34 -8 -52 -34 -54 -62 c 30 4 52 26 54 62 z"/>
    <path d="M52 108 c 36 -2 60 -24 68 -52 c -32 0 -58 20 -68 52 z"/>
    <path d="M78 62 c -34 -12 -48 -40 -46 -68 c 30 8 48 32 46 68 z"/>
    <path d="M106 14 c 34 -6 54 -30 58 -58 c -30 4 -52 26 -58 58 z"/>
    <path d="M128 -26 c -30 -14 -42 -40 -38 -66 c 28 10 42 32 38 66 z"/>
  </g>
  <!-- right sprig -->
  <g transform="translate(1010 250) rotate(162)">
    <path d="M0 200 C 40 120, 70 40, 150 -60"/>
    <path d="M28 150 c -34 -8 -52 -34 -54 -62 c 30 4 52 26 54 62 z"/>
    <path d="M52 108 c 36 -2 60 -24 68 -52 c -32 0 -58 20 -68 52 z"/>
    <path d="M78 62 c -34 -12 -48 -40 -46 -68 c 30 8 48 32 46 68 z"/>
    <path d="M106 14 c 34 -6 54 -30 58 -58 c -30 4 -52 26 -58 58 z"/>
    <path d="M128 -26 c -30 -14 -42 -40 -38 -66 c 28 10 42 32 38 66 z"/>
  </g>
  <!-- small sprig, lower right -->
  <g transform="translate(930 1260) rotate(28) scale(.7)">
    <path d="M0 200 C 40 120, 70 40, 150 -60"/>
    <path d="M28 150 c -34 -8 -52 -34 -54 -62 c 30 4 52 26 54 62 z"/>
    <path d="M52 108 c 36 -2 60 -24 68 -52 c -32 0 -58 20 -68 52 z"/>
    <path d="M78 62 c -34 -12 -48 -40 -46 -68 c 30 8 48 32 46 68 z"/>
    <path d="M106 14 c 34 -6 54 -30 58 -58 c -30 4 -52 26 -58 58 z"/>
  </g>
</svg>
<div class="phone">
  <div class="screen"><img id="frame" alt=""><div class="island"></div><div id="touches"></div></div>
</div>
<script>
  const img = document.getElementById('frame');
  const touches = document.getElementById('touches');
  const SCREEN_W = 508;
  // A tap shows as a soft disc that appears just before the tap and fades after it.
  const LEAD = 0.10, TAIL = 0.34;
  window.renderFrame = async ({ t, frameUrl, score }) => {
    img.src = frameUrl;
    await img.decode();
    const k = SCREEN_W / (score.width || 390);
    const now = t + (score.start || 0);
    touches.innerHTML = '';
    for (const ev of score.events || []) {
      let p = ev.tap || ev.hold || ev.at;          // "at": where a button press lands, for the indicator only
      if (!p) continue;
      const tail = ev.hold ? 0.7 + TAIL : TAIL;
      const age = now - ev.t;
      if (age < -LEAD || age > tail) continue;
      const fadeIn = Math.min(1, (age + LEAD) / LEAD);
      const fadeOut = age <= tail - TAIL ? 1 : 1 - (age - (tail - TAIL)) / TAIL;
      const d = document.createElement('div');
      d.className = 'touch';
      d.style.left = p[0] * k + 'px';
      d.style.top = p[1] * k + 'px';
      d.style.opacity = Math.max(0, Math.min(fadeIn, fadeOut));
      d.style.transform = `scale(${age < 0 ? 1.15 : 0.82 + 0.18 * Math.max(0, fadeOut)})`;
      touches.appendChild(d);
    }
  };
</script>
