<!doctype html>
<meta charset="utf-8">
<!--
  "Plate", final: a page from a botanical plate book, 1080 x 1350.
  The real recorded app plays in a phone (screen 508 x 1100) on the right of a cream page; on the left the
  wordmark, one Fraunces-italic figure caption that changes with the story (four in a loop), and the app's own
  wild rose drawn in faint outline. Everything that moves is computed from the frame's time.
  Optional in the score: "stillCaption": <index> pins one caption at full opacity (used for the static picture).
-->
<style>
  @font-face { font-family: 'Fraunces'; font-style: normal; src: url('../../assets/fonts/Fraunces-Regular.ttf'); }
  @font-face { font-family: 'Fraunces'; font-style: italic; src: url('../../assets/fonts/Fraunces-Italic.ttf'); }
  :root { --paper: #FAF8EE; --ink: #1F3D2E; --soft: #6C8A72; --hair: #C3D1B8; }
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(62% 46% at 80% 92%, rgba(203,225,193,.62) 0%, rgba(203,225,193,0) 72%),
      radial-gradient(50% 36% at 8% 4%, #FFFEF9 0%, rgba(255,254,249,0) 70%),
      var(--paper);
    font-family: 'Fraunces', serif; color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  .plate { position: absolute; inset: 34px; border: 1.5px solid rgba(31,61,46,.13); border-radius: 8px; background: rgba(255,255,255,.30); }

  .wordmark { position: absolute; left: 96px; top: 1146px; font-size: 44px; line-height: 52px; letter-spacing: -.014em; white-space: nowrap; }
  .wordmark i { font-style: italic; }
  .head-rule { position: absolute; left: 97px; top: 1120px; width: 46px; height: 1.5px; background: var(--hair); }

  .legend { position: absolute; left: 96px; top: 600px; width: 340px; }
  .fig { position: relative; height: 36px; font-size: 30px; line-height: 36px; letter-spacing: .04em; color: rgba(31,61,46,.70); white-space: nowrap; }
  .fig #figs { position: absolute; left: 64px; top: 0; }
  #figs span { position: absolute; left: 0; top: 0; }
  .caption { position: absolute; left: 0; top: 66px; font-style: italic; font-size: 52px; line-height: 62px; letter-spacing: -.012em; white-space: nowrap; }

  .rose { position: absolute; left: 84px; top: 150px; width: 270px; height: 270px; color: var(--ink); opacity: .2; transform-origin: 50% 50%; }
  .rose svg { width: 100%; height: 100%; overflow: visible; }

  .phone {
    position: absolute; left: 474px; top: 113px; width: 508px; height: 1100px; padding: 12px; border-radius: 74px;
    background: linear-gradient(145deg, #2C3D33 0%, #1A271F 60%, #121C16 100%);
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,.32) inset,
      0 2px 0 1px rgba(16,26,20,.9),
      0 56px 80px -34px rgba(31,61,46,.38),
      0 26px 34px -20px rgba(31,61,46,.24),
      0 0 0 1px rgba(31,61,46,.22);
  }
  .screen { position: relative; width: 508px; height: 1100px; border-radius: 62px; overflow: hidden; background: #FDFBF3; }
  .screen img { display: block; width: 508px; height: 1100px; }
  .island { position: absolute; top: 15px; left: 50%; width: 117px; height: 33px; margin-left: -58.5px; border-radius: 16.5px; background: #0D1410; }
  .touch { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
           background: rgba(31,61,46,.15); border: 2px solid rgba(31,61,46,.42);
           box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 0 10px rgba(31,61,46,.05); }
</style>

<div class="plate"></div>

<div class="legend">
  <div class="fig">Fig.<span id="figs"></span></div>
  <div id="captions"></div>
</div>

<div class="head-rule"></div>
<div class="wordmark">Sound <i>Garden</i></div>

<div class="phone">
  <div class="screen"><img id="frame" alt=""><div class="island"></div><div id="touches"></div></div>
</div>

<script>
  const img = document.getElementById('frame');
  const touches = document.getElementById('touches');
  const figs = document.getElementById('figs');
  const captions = document.getElementById('captions');
  const rose = document.getElementById('rose');
  const SCREEN_W = 508;
  const LEAD = 0.10, TAIL = 0.32;              // a tap's soft disc comes down just before the touch and lifts after it
  const WAIT = 0.24, IN = 0.36, OUT = 0.26;    // a caption leaves upward first; the next comes up after it

  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const ease = (v) => v * v * (3 - 2 * v);
  let built = false;

  function build(score) {
    for (const c of score.captions || []) {
      const n = document.createElement('span');
      n.textContent = c.fig;
      figs.appendChild(n);
      const d = document.createElement('div');
      d.className = 'caption';
      d.innerHTML = c.lines.map((line) => line.replace(/&/g, '&amp;').replace(/</g, '&lt;')).join('<br>');
      captions.appendChild(d);
    }
    built = true;
  }

  window.renderFrame = async ({ t, frameUrl, score }) => {
    if (!built) build(score);
    img.src = frameUrl;
    await img.decode();
    await document.fonts.ready;

    const loop = score.loop || 16;
    const now = t + (score.start || 0);
    const story = (((now - (score.storyStart || 0)) % loop) + loop) % loop;   // seconds since the last Clear

    (score.captions || []).forEach((c, index) => {
      let opacity, coming = 1, going = 0;
      if (score.stillCaption !== undefined) {
        opacity = index === score.stillCaption ? 1 : 0;
      } else {
        const age = (((story - c.from) % loop) + loop) % loop;
        const length = (((c.to - c.from) % loop) + loop) % loop || loop;
        coming = ease(clamp01((age - WAIT) / IN));
        going = ease(clamp01((age - length) / OUT));
        opacity = age > length + OUT ? 0 : Math.min(coming, 1 - going);
      }
      const line = captions.children[index];
      line.style.opacity = opacity.toFixed(3);
      line.style.transform = `translateY(${((1 - coming) * 10 - going * 7).toFixed(2)}px)`;
      figs.children[index].style.opacity = opacity.toFixed(3);
    });

    // The faint rose on the page turns a little once in each loop, so it is back where it began at the restart.
    const turn = 4 * Math.sin((2 * Math.PI * story) / loop);
    rose.style.transform = `rotate(${(-8 + turn).toFixed(3)}deg)`;

    const k = SCREEN_W / (score.width || 390);
    touches.innerHTML = '';
    if (score.noTouches) return;
    for (const ev of score.events || []) {
      const p = ev.tap || ev.hold || ev.at;
      if (!p) continue;
      const tail = ev.hold ? 0.7 + TAIL : TAIL;
      const age = now - ev.t;
      if (age < -LEAD || age > tail) continue;
      const fadeIn = Math.min(1, (age + LEAD) / LEAD);
      const fadeOut = age <= tail - TAIL ? 1 : 1 - (age - (tail - TAIL)) / TAIL;
      const d = document.createElement('div');
      d.className = 'touch';
      d.style.left = p[0] * k + 'px';
      d.style.top = p[1] * k + 'px';
      d.style.opacity = Math.max(0, Math.min(fadeIn, fadeOut)).toFixed(3);
      d.style.transform = `scale(${(age < 0 ? 1.16 - 0.16 * fadeIn : 0.84 + 0.16 * Math.max(0, fadeOut)).toFixed(3)})`;
      touches.appendChild(d);
    }
  };
</script>
