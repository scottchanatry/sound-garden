<style>
  @font-face { font-family: 'Fraunces'; font-style: normal; src: url('../../assets/fonts/Fraunces-Regular.ttf'); }
  @font-face { font-family: 'Fraunces'; font-style: italic; src: url('../../assets/fonts/Fraunces-Italic.ttf'); }
  :root { --paper: #FAF8EE; --ink: #1F3D2E; --soft: #6C8A72; --hair: #C3D1B8; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(48% 70% at 78% 100%, rgba(203,225,193,.62) 0%, rgba(203,225,193,0) 72%),
      radial-gradient(40% 50% at 6% 0%, #FFFEF9 0%, rgba(255,254,249,0) 70%),
      var(--paper);
    font-family: 'Fraunces', serif; color: var(--ink);
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  .plate { position: absolute; left: 26px; top: 26px; right: 26px; bottom: -20px; border: 1.5px solid rgba(31,61,46,.13); border-radius: 8px; background: rgba(255,255,255,.30); }
  .rose { position: absolute; left: 104px; top: 104px; width: 150px; height: 150px; color: var(--ink); opacity: .2; transform: rotate(-8deg); }
  .rose svg { width: 100%; height: 100%; overflow: visible; }
  .wordmark { position: absolute; left: 112px; top: 276px; font-size: 82px; line-height: 92px; letter-spacing: -.02em; white-space: nowrap; color: #1F3D2E; }
  .wordmark i { font-style: italic; }
  .rule { position: absolute; left: 115px; top: 398px; width: 56px; height: 1.5px; background: var(--hair); }
  .line { position: absolute; left: 112px; top: 422px; font-size: 31px; line-height: 46px; font-style: italic; color: #3B5A48; white-space: nowrap; }
  .phone {
    position: absolute; left: 684px; top: 64px; width: 392px; height: 849px; padding: 10px; border-radius: 58px;
    background: linear-gradient(145deg, #2C3D33 0%, #1A271F 60%, #121C16 100%);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.32) inset, 0 2px 0 1px rgba(16,26,20,.9),
      0 40px 70px -30px rgba(31,61,46,.38), 0 0 0 1px rgba(31,61,46,.22);
  }
  .screen { position: relative; width: 392px; height: 849px; border-radius: 48px; overflow: hidden; background: #FDFBF3; }
  .screen img { display: block; width: 392px; height: 849px; }
  .island { position: absolute; top: 12px; left: 50%; width: 90px; height: 26px; margin-left: -45px; border-radius: 13px; background: #0D1410; }
</style>
